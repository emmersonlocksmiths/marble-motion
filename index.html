<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Marble Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
<script>(function(){ var t='auto'; try{ if(location.hash==='#admin') t=localStorage.getItem('mm_theme')||'auto'; }catch(e){} /* shop always follows the device */
  var dark = t==='dark' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light'); })();</script>
<meta name="description" content="Designed for motion, built for fun. Build-your-own 3D printed marble towers, made on the Sunshine Coast.">
<link rel="manifest" href="manifest.webmanifest" id="mf">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-shop-32.png" id="fav">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-shop.png" id="ati">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marble Motion">
<meta name="theme-color" content="#FBF7F0">
<meta property="og:title" content="Marble Motion">
<meta property="og:description" content="Designed for motion, built for fun. Build-your-own 3D printed marble towers, made on the Sunshine Coast.">
<meta property="og:image" content="https://emmersonlocksmiths.github.io/marble-motion/icons/banner.jpg">
<style>
:root{
  --bg:#FBF7F0; --card:#FFFFFF; --ink:#1F2430; --muted:#6B7180; --line:#E8E1D5;
  --accent:#2F5FD0; --accent-ink:#fff; --accent-soft:#E6EDFC;
  --red:#E4572E; --yellow:#F3B61F; --green:#2E9E6A; --purple:#7B5CD6;
  --radius:16px; --shadow:0 1px 2px rgba(31,36,48,.06),0 4px 14px rgba(31,36,48,.06);
  --field:#FFFFFF; --hover:#F4EFE6; --tabs:#EFE8DC; --soft:#FBF8F3; --imgbg:#FFFFFF; --header:rgba(251,247,240,.92);
  --stage:radial-gradient(circle at 50% 35%,#ffffff,#EFE8DC);
  --note-bg:#FFF4D6; --note-line:#F3DD9B; --note-ink:#7A5600;
  --info-bg:#EEF2FC; --info-line:#C9D7F8; --info-ink:#24418F;
  --ok-bg:#E5F5EC; --ok-line:#BFE6CF; --ok-ink:#1E6B45;
  color-scheme: light;
}
[data-theme=dark]{
  --bg:#11141B; --card:#1A1E28; --ink:#ECEEF3; --muted:#9AA1AF; --line:#2B3140;
  --accent:#5B8CFF; --accent-ink:#fff; --accent-soft:#1D2A4D;
  --red:#FF6B4A; --green:#3FC387;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --field:#141821; --hover:#232937; --tabs:#202634; --soft:#1F2430; --imgbg:#FFFFFF; --header:rgba(17,20,27,.9);
  --stage:radial-gradient(circle at 50% 35%,#2A3142,#151922);
  --note-bg:#2E2614; --note-line:#5A4A1F; --note-ink:#F3D27A;
  --info-bg:#18223A; --info-line:#2D3E66; --info-ink:#A9C1FF;
  --ok-bg:#132A20; --ok-line:#22573E; --ok-ink:#7FE0B0;
  color-scheme: dark;
}
[data-theme=dark] .st-new{background:#3A2216;color:#FFB08A}[data-theme=dark] .st-confirmed{background:#1D2A4D;color:#A9C1FF}
[data-theme=dark] .st-printing{background:#2A2245;color:#C7B6FF}[data-theme=dark] .st-ready{background:#33290F;color:#F3D27A}
[data-theme=dark] .st-completed,[data-theme=dark] .paid-yes,[data-theme=dark] .save{background:#132A20;color:#7FE0B0}
[data-theme=dark] .st-cancelled{background:#262A33;color:#9AA1AF}[data-theme=dark] .paid-no{background:#33250F;color:#F0BE7A}
[data-theme=dark] .btn.primary:hover{background:#4677F0}
[data-theme=dark] .toast{background:#ECEEF3;color:#11141B}
.banner img.b-dark{display:none}[data-theme=dark] .banner img.b-dark{display:block}[data-theme=dark] .banner img.b-light{display:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Lexend',system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.brand,.price,.kpi .v{font-family:'Lexend',system-ui,sans-serif;letter-spacing:-.015em}
h1,.brand,.price,.kpi .v{font-weight:700} h2,h3{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{position:sticky;top:0;z-index:20;background:var(--header);padding-top:env(safe-area-inset-top);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink);letter-spacing:-.01em}
.logo-img{display:inline-block;vertical-align:middle}
.brand small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .08s,background .15s}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#2752BA}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800}
main{padding:22px 0 60px}
.banner{margin:0 0 14px;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#FBF7F0}
.banner img{display:block;width:100%;height:clamp(200px,16vw,230px);object-fit:cover}
[data-theme=dark] .banner{background:#021A44}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
.hero h1{font-size:34px;line-height:1.08;margin:0 0 10px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:0 0 16px;font-size:16px}
.steps{display:flex;gap:10px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:13px}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}
.tabs{display:inline-flex;background:var(--tabs);border-radius:999px;padding:4px;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .img{aspect-ratio:4/3;background:var(--imgbg);display:block;width:100%;object-fit:cover}
.card .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:17px;letter-spacing:-.01em}
.price{font-weight:800;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.includes{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.includes ul{margin:4px 0 0;padding-left:18px}
.save{display:inline-block;background:#E5F5EC;color:var(--green);font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px}
.row{display:flex;gap:8px;align-items:center}
.add-row{display:flex;align-items:center;gap:8px}
.add-row .colour{flex:1;min-width:0;margin:0}
.addbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.addbtn svg{width:22px;height:22px}
.addbtn:active{transform:scale(.92)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--field)}
.qty button{border:0;background:transparent;width:32px;height:34px;cursor:pointer;font-weight:800;font-size:16px}
.qty input{width:36px;border:0;text-align:center;font-weight:700;background:transparent;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{display:none}
select,input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--field);color:var(--ink);outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13px}
label.f span.hint{font-weight:500;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.line{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--imgbg)}
.tot{display:flex;justify-content:space-between;padding:5px 0}
.tot.big{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.radio-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--field)}
.radio-card.on{border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{margin-top:3px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;text-transform:capitalize;white-space:nowrap}
.st-new{background:#FDECE6;color:#C2410C}.st-confirmed{background:#E6EDFC;color:#2752BA}.st-printing{background:#EFE9FB;color:#6142C2}
.st-ready{background:#FFF4D6;color:#9A6B00}.st-completed{background:#E5F5EC;color:#22794F}.st-cancelled{background:#EEE;color:#777}
.paid-yes{background:#E5F5EC;color:#22794F}.paid-no{background:#F7EEE3;color:#9A5B12}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,32,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.modal{background:var(--card);border-radius:20px;max-width:720px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.admin-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.admin-bar h1{margin:0;font-size:24px}
.demo-note{background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-ink);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding:10px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .b{width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--accent);min-height:3px}
.bar .lbl{font-size:12px;color:var(--muted);font-weight:700}
.bar .val{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.inc-row{display:grid;grid-template-columns:1fr 90px 36px;gap:8px;margin-bottom:8px}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:14px}
.pal-card{display:flex;align-items:center;gap:8px;padding:10px 12px}
.pal-card .pal-name{flex:1;min-width:0}
.pal-sw{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:62%}
.pal-sw span{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.shuf{display:flex;gap:8px}
.shuf .btn{white-space:nowrap}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pc-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px}
.pc-tile img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:var(--imgbg)}
.pc-tile .pc-name{font-weight:700;padding:6px 8px 0;line-height:1.25}
.pc-tile .pc-col{color:var(--muted);padding:2px 8px 8px}
@media (max-width:760px){ .shuf{width:100%} .shuf .btn{flex:1;padding:10px 6px;font-size:14px} .brand .logo-img{height:34px!important} .pal-grid{grid-template-columns:1fr} .pc-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.alt-box{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:-2px 0 8px;background:var(--soft)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:13px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-1px;margin-right:4px}
/* invoice */
.invoice{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:14px;padding:30px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.invoice .ih{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #1a1a1a;padding-bottom:16px;margin-bottom:18px}
.invoice h2{margin:0;font-size:24px}
.invoice .doc{font-size:22px;font-weight:800;text-align:right;letter-spacing:.04em;text-transform:uppercase}
.invoice table{width:100%;border-collapse:collapse;margin:14px 0}
.invoice th{text-align:left;font-size:12px;text-transform:uppercase;border-bottom:1px solid #ccc;padding:6px 4px}
.invoice td{padding:8px 4px;border-bottom:1px solid #eee}
.invoice .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.invoice .pay{background:#F6F6F6;border-radius:10px;padding:14px;margin-top:16px}
.invoice .tots{margin-left:auto;width:260px}
.invoice .tots div{display:flex;justify-content:space-between;padding:3px 0}
.invoice .tots .g{font-weight:800;font-size:17px;border-top:2px solid #1a1a1a;margin-top:6px;padding-top:8px}
@media print{
  body.printing > *:not(#print-root){display:none!important}
  body.printing #print-root{display:block!important}
  body.printing .invoice{border:0;padding:0}
}
#print-root{display:none}
.syncbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;max-width:640px;margin:0 auto;background:#FDECEA;color:#8A1F14;border:1px solid #F3B8B0;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:14px}
[data-theme=dark] .syncbar{background:#3A1C19;color:#F6C3BC;border-color:#6B2C25}
.chk{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.chk.ok{background:var(--ok-bg,#E6F4EC);color:var(--ok,#22794F)}
.chk.bad{background:#FDECEA;color:#8A1F14;border:1px solid #F3B8B0}
[data-theme=dark] .chk.bad{background:#3A1C19;color:#F6C3BC;border-color:#6B2C25}
[data-theme=dark] .chk.ok{background:#173326;color:#9BE0B8}
.chk ul{margin:6px 0 8px;padding-left:18px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.modal-head{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);margin:-22px -22px 16px;padding:16px 22px;border-bottom:1px solid var(--line);border-radius:20px 20px 0 0}
@media (max-width:760px){ .modal-head{top:0;margin:-16px -16px 14px;padding:12px 16px calc(12px);border-radius:0} .modal-head h2{font-size:18px;width:100%} }
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none}
.theme-btn{width:38px;height:38px;padding:0;font-size:17px}
/* package card: side by side on wider screens */
.kit-grid{display:grid;gap:18px}
@media (min-width:820px){ .kit-card{flex-direction:row} .kit-card .img{width:46%;aspect-ratio:auto;min-height:100%;object-fit:cover} .kit-card .body{padding:22px} }
/* package builder: picks on the left, sticky 3D preview + total on the right */
.builder-grid{display:block}
@media (min-width:980px){
  .builder-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:26px;align-items:start}
  .b-right{position:sticky;top:84px}
  .stage{height:460px!important}
}
.b-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
/* floating cart bar on phones */
.cart-bar{display:none}
@media (max-width:760px){
  body{font-size:15px}
  select,input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],textarea{font-size:16px} /* stops iPhone zooming into fields */
  header.top .wrap{height:56px}
  .brand{font-size:16px}
  main{padding:14px 0 90px}
  .banner{border-radius:16px;margin-bottom:10px}
  .steps{gap:6px}.steps .step{padding:4px 10px 4px 4px}
  .tabs{display:flex;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:100%}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;flex:none}
  .panel{padding:14px;border-radius:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .card .body{padding:11px;gap:6px}.card h3{font-size:15px}.price{font-size:16px}
  .b-footer{position:sticky;bottom:0;margin:0 -14px -14px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-radius:0 0 14px 14px;box-shadow:0 -6px 16px rgba(0,0,0,.08);z-index:5}
  .b-footer .btn.primary{flex:1 1 100%;order:3;padding:13px 16px;white-space:nowrap}
  .b-footer .price{margin-left:auto}
  .stage{height:320px!important}
  .modal-bg{padding:0;align-items:flex-start}
  .modal{border-radius:0;min-height:100vh;min-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  .admin-bar h1{font-size:20px}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:19px}

// Pieces that already have a colour keep it unless fresh=true (the 🎲 button).
function assignColours(pieces, pal, existing={}, fresh=false){
  const names=(pal?.colours||[]).map(c=>c.name), out={}; if(!names.length){ pieces.forEach(pc=>out[pc.key]=''); return out; }
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

}

// cost of one printed part or marble pack. Wastage applies to printing only, not marbles.
function partBreakdown(p,c){

  const mac=on?h*(num(c.printerPrice)/Math.max(1,num(c.printerLifeHours))+num(c.maintPerHour)):0;

}
const marblePacks = products => products.filter(p=>p.type==='part'&&p.tier==='marbles'&&p.active);

// random basic tracks: a package can include N different basic tracks picked at random (customer can reshuffle)
const randomPool = (k, products, picks) => { const skip=new Set([...(k.presetBasic||[]).map(i=>i.partId),...Object.keys(picks||{})]);
  return products.filter(p=>p.type==='part'&&p.tier==='basic'&&p.active&&!skip.has(p.id)); };

  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }

// swaps = {includeIndex: chosenPartId}. Price difference = chosen price − included price (× qty).
const incOptions = i => [i.partId,...(i.alts||[]).filter(a=>a&&a!==i.partId)];
function kitIncludes(k, swaps){ return (k.includes||[]).map((i,idx)=>{ const s=swaps&&swaps[idx]; return s&&s!==i.partId&&incOptions(i).includes(s)?{...i,partId:s}:{...i}; }); }
function swapPrice(k, idx, partId, products){ const i=(k.includes||[])[idx]; if(!i||partId===i.partId||!incOptions(i).includes(partId)) return 0;
  const a=products.find(x=>x.id===partId), b=products.find(x=>x.id===i.partId); return a&&b?(a.price-b.price)*num(i.qty):0; }
function swapUpgrade(k, swaps, products){ return Object.entries(swaps||{}).reduce((t,[idx,id])=>t+swapPrice(k,+idx,id,products),0); }
const kitExtra = (k, sel, products) => marbleUpgrade(k, sel&&sel.marbles, products) + swapUpgrade(k, sel&&sel.swaps, products);
const signedMoney = v => v>0?'+'+money(v):v<0?'−'+money(-v):'Included';
function marbleUpgrade(kit, marbleId, products){
  if(!kit.marbleChoice) return 0; const m=products.find(x=>x.id===marbleId), d=defaultMarble(products);
  return m&&d?Math.max(0,m.price-d.price):0;

  const ps=products.filter(p=>p.type==='part'&&p.tier===tier&&p.active), b=ZERO();

function kitBreakdown(k, products, c, sel){
  const b=ZERO();

    [['basic',num(k.chooseBasic)],['premium',num(k.choosePremium)]].forEach(([t,n])=>{ const ps=products.filter(p=>p.type==='part'&&p.tier===t&&p.active); if(!ps.length||!n) return;

}

const CHECK_SINCE = new Date('2026-11-22T07:00:00+10:00').getTime(); // price-change tracking started
// re-prices a saved order from the current shop and flags anything that doesn't add up
function checkOrder(o){

    const p=P.find(x=>x.id===i.productId), qty=Number(i.qty);
    if(!Number.isInteger(qty)||qty<1||qty>50) issues.push({bad:true,msg:`${i.name}: odd quantity (${esc(String(i.qty))})`});
    if(!p){ issues.push({msg:`${esc(i.name)} is no longer in the shop, so it can't be re-priced`}); sub+=num(i.price)*(qty||0); return {i,exp:num(i.price)}; }
    if(!p.active) issues.push({msg:`${esc(p.name)} is currently hidden from the shop`});

/* ---------- cloud sync ---------- */
const PRIVATE_PRODUCT_KEYS=['grams','printHours','boughtIn'], PRIVATE_SETTING_KEYS=['costs','adminPin'];
const stable = v => Array.isArray(v)?'['+v.map(stable).join(',')+']' : v&&typeof v==='object' ? '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}' : JSON.stringify(v===undefined?null:v);
const clean = v => JSON.parse(JSON.stringify(v));
const Cloud = {
  db:null, auth:null, user:null, isAdmin:false, ready:false, error:'',
  last:{}, pubProducts:{}, costDocs:{}, pubSettings:null, privSettings:null, orderDocs:{}, knownOrders:new Set(),
  loaded:{products:false,settings:false,costs:false,privSettings:false,orders:false}, adminUnsub:[], firstOrders:true,
  loadScript:src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);}),
  async start(){
    try{
      const v='10.12.2', base=`https://www.gstatic.com/firebasejs/${v}/`;
      await this.loadScript(base+'firebase-app-compat.js');
      await Promise.all([this.loadScript(base+'firebase-auth-compat.js'),this.loadScript(base+'firebase-firestore-compat.js')]);
      firebase.initializeApp(FB_CONFIG); this.db=firebase.firestore(); this.auth=firebase.auth();
    }catch(e){ this.error='Could not connect to the shop database. Check your internet connection and refresh.'; render(); return; }
    this.db.collection('products').onSnapshot(snap=>{ this.pubProducts={}; snap.forEach(d=>{ this.pubProducts[d.id]=d.data(); this.last['products/'+d.id]=stable(d.data()); });
      this.loaded.products=true; this.merge(); }, e=>this.fail(e));
    this.db.doc('settings/public').onSnapshot(d=>{ this.pubSettings=d.exists?d.data():null; if(d.exists) this.last['settings/public']=stable(d.data()); this.loaded.settings=true; this.merge(); }, e=>this.fail(e));
    this.auth.onAuthStateChanged(u=>{ this.user=u; this.isAdmin=!!u&&u.emailVerified!==false&&ADMIN_EMAILS.includes((u.email||'').toLowerCase()); ui.admin=this.isAdmin;
      this.adminUnsub.forEach(f=>f()); this.adminUnsub=[]; if(this.isAdmin) this.subscribeAdmin(); if(this.isAdmin) u.getIdToken(true).catch(()=>{}); render(); });
  },
  subscribeAdmin(){
    this.firstOrders=true;
    this.adminUnsub.push(this.db.collection('productCosts').onSnapshot(snap=>{ this.costDocs={}; snap.forEach(d=>{ this.costDocs[d.id]=d.data(); this.last['productCosts/'+d.id]=stable(d.data()); }); this.loaded.costs=true; this.merge(); }, e=>this.fail(e)));
    this.adminUnsub.push(this.db.doc('settings/private').onSnapshot(d=>{ this.privSettings=d.exists?d.data():null; if(d.exists) this.last['settings/private']=stable(d.data()); this.loaded.privSettings=true; this.merge(); }, e=>this.fail(e)));
    this.adminUnsub.push(this.db.collection('orders').onSnapshot(snap=>{
      if(!this.firstOrders && snap.docChanges().some(c=>c.type==='added'&&!this.knownOrders.has(c.doc.id))) toast('🔔 New order received!');
      this.orderDocs={}; snap.forEach(d=>{ this.orderDocs[d.id]=d.data(); this.last['orders/'+d.id]=stable(d.data()); this.knownOrders.add(d.id); });
      this.firstOrders=false; this.loaded.orders=true; this.merge(); }, e=>this.fail(e)));
  },
  fail(e){ console.error(e); this.error=e.code==='permission-denied'?'You don\'t have permission to see that. Sign in with the admin Google account.':'Connection problem: '+(e.message||e.code); render(); },
  merge(){
    const d=Store.data, def=seed().settings;
    d.products=Object.entries(this.pubProducts).map(([id,p])=>({id,...p,...(this.costDocs[id]||{})})).sort((a,b)=>num(a.sort)-num(b.sort));
    d.settings={...def,...(this.pubSettings||{}),...(this.privSettings||{})};
    d.settings.costs={...DEFAULT_COSTS,...(d.settings.costs||{}),includePrinterCosts:true};
    if(!d.settings.palettes) d.settings.palettes=clean(DEFAULT_PALETTES);
    Store._prices=Object.fromEntries(d.products.map(p=>[p.id,p.price]));
    d.orders=Object.entries(this.orderDocs).map(([id,o])=>({id,...o})).sort((a,b)=>b.createdAt-a.createdAt);
    this.ready=this.loaded.products&&this.loaded.settings;
    if(this.isAdmin&&this.loaded.costs&&this.loaded.privSettings&&this.loaded.orders){ this.fillPrintHours(); this.fillOrderCosts(); }
    ui.seenOrders=d.orders.length; render();
  },
  fillPrintHours(){ // one-off: add the measured print times to pieces that don't have one yet
    if(this._hoursDone) return; this._hoursDone=true;
    const defs=Object.fromEntries(seed().products.map(p=>[p.id,p.printHours]));
    let n=0; Store.data.products.forEach(p=>{ if(p.type==='part'&&!num(p.printHours)&&num(defs[p.id])){ p.printHours=defs[p.id]; n++; } });
    if(n){ this.push(); setTimeout(()=>toast(`Print times added to ${n} pieces`),300); }
  },
  fillOrderCosts(){ // customers can't see costs, so work them out when the admin opens the orders
    const c=Store.settings.costs; let changed=false;
    Store.data.orders.forEach(o=>{
      o.items.forEach(i=>{ if(i.cost==null){ const p=Store.product(i.productId); i.cost=p?+costOf(p,Store.products,c,i.sel||undefined).toFixed(2):0; changed=true; } });
      if(o.costPackaging==null){ o.costPackaging=num(c.packagingPerOrder); o.costPostage=o.delivery==='post'?num(c.postageActual):0; o.costFees=+(o.total*num(c.paymentFeePct)/100).toFixed(2); changed=true; }
    });
    if(changed) this.push();
  },
  get empty(){ return this.ready&&!Object.keys(this.pubProducts).length&&!this.pubSettings; },
  pending:0, syncErr:null,
  track(p,path){ this.pending++; p.then(()=>{ if(--this.pending===0&&!this.syncErr) toast('✓ Saved to the shop'); })
    .catch(e=>{ this.pending--; delete this.last[path]; this.failSave(e,path); }); },
  failSave(e,path){ const code=(e&&(e.code||e.message))||'unknown';
    const size=path&&path.startsWith('products/')?Math.round(JSON.stringify(Store.product(path.slice(9))||{}).length/1024):0;
    this.syncErr={code,path:path||'',size,at:Date.now()}; console.error('Save failed',path,e); syncBar(); },
  put(path,data){ const j=stable(data); if(this.last[path]===j) return; this.last[path]=j;
    let p; try{ p=this.db.doc(path).set(clean(data)); }catch(e){ delete this.last[path]; this.failSave(e,path); return; } this.track(p,path); },
  del(path){ delete this.last[path]; let p; try{ p=this.db.doc(path).delete(); }catch(e){ this.failSave(e,path); return; } this.track(p,path); },
  retry(){ this.syncErr=null; syncBar(); this.push(); },
  reloadFromShop(){ this.syncErr=null; syncBar(); this.merge(); render(); toast('Showing what the shop has saved'); },
  push(){
    if(!this.db||!this.isAdmin) return;
    const d=Store.data, ids=new Set(d.products.map(p=>p.id));
    d.products.forEach((p,i)=>{ const pub={...p,sort:i}, priv={}; delete pub.id; PRIVATE_PRODUCT_KEYS.forEach(k=>{ priv[k]=num(p[k]); delete pub[k]; });
      this.put('products/'+p.id,pub); this.put('productCosts/'+p.id,priv); });
    Object.keys(this.pubProducts).forEach(id=>{ if(!ids.has(id)){ this.del('products/'+id); this.del('productCosts/'+id); delete this.pubProducts[id]; } });
    const pub={}, priv={}; Object.entries(d.settings).forEach(([k,v])=>{ (PRIVATE_SETTING_KEYS.includes(k)?priv:pub)[k]=v; });
    this.put('settings/public',pub); this.put('settings/private',priv);
    const oids=new Set(d.orders.map(o=>o.id));
    d.orders.forEach(o=>{ const x={...o}; delete x.id; this.put('orders/'+o.id,x); });
    Object.keys(this.orderDocs).forEach(id=>{ if(!oids.has(id)){ this.del('orders/'+id); delete this.orderDocs[id]; } });
  },
  async placeOrder(o){ const x=clean(o); delete x.id; await this.db.collection('orders').doc(o.id).set(x); },
  signIn(){ const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
    this.auth.signInWithPopup(p).catch(e=>{ if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment') this.auth.signInWithRedirect(p); else if(e.code!=='auth/popup-closed-by-user') toast('Sign-in failed: '+e.code); }); },
  signInEmail(email,pw){ return this.auth.signInWithEmailAndPassword(email,pw); },
  resetPassword(email){ return this.auth.sendPasswordResetEmail(email); },
  signOut(){ this.auth.signOut(); }
};

const Store = {
  data:null,

    this.data=lsGet(LS_KEY,null)||seed(); this.data.settings.costs={...DEFAULT_COSTS,...(this.data.settings.costs||{})};
    this.data.settings.costs.includePrinterCosts=true;

    this.data.products.forEach(k=>{ if(k.type!=='kit'||k.presetBasic) return;
      k.presetBasic=[]; if(k.id==='k-standard'){ k.presetBasic=STANDARD_PRESET.map(id=>({partId:id,qty:1})); k.chooseBasic=0;
        k.description='7 basic tracks chosen for you, plus 3 premium tracks of your choice. Base, top funnel, end hopper, 18 connectors and a pack of 10 marbles are included.'; } });
    this.save(); },
  // remembers when each price was last changed, so the order check can tell a price change from a tampered order
  stampPrices(){ const now=Date.now(), prev=this._prices; if(prev) this.data.products.forEach(p=>{ if(p.id in prev&&prev[p.id]!==p.price) p.priceChangedAt=now; });
    this._prices=Object.fromEntries(this.data.products.map(p=>[p.id,p.price])); },
  save(){ this.stampPrices(); if(CLOUD) Cloud.push(); else lsSet(LS_KEY,this.data); },
  get products(){ return this.data.products; }, get orders(){ return this.data.orders; }, get settings(){ return this.data.settings; },
  product(id){ return this.data.products.find(p=>p.id===id); },
  upsertProduct(p){ const i=this.data.products.findIndex(x=>x.id===p.id); i>=0?this.data.products[i]=p:this.data.products.push(p); this.save(); },
  deleteProduct(id){ this.data.products=this.data.products.filter(p=>p.id!==id); this.data.products.forEach(k=>{ if(k.includes) k.includes=k.includes.filter(i=>i.partId!==id); }); this.save(); },
  addOrder(o){ if(CLOUD&&!Cloud.isAdmin) return Cloud.placeOrder(o).then(()=>o); this.data.orders.unshift(o); this.save(); return Promise.resolve(o); },
  updateOrder(id,patch){ const o=this.data.orders.find(x=>x.id===id); if(o){Object.assign(o,patch); this.save();} },
  deleteOrder(id){ this.data.orders=this.data.orders.filter(o=>o.id!==id); this.save(); },
  saveSettings(s){ this.data.settings={...this.data.settings,...s}; this.save(); },
  reset(){ this.data=seed(); this.save(); },

function submitCheckout(form){
  const f=Object.fromEntries(new FormData(form)), post=ui.delivery==='post', err=[];
  if(!f.name?.trim())err.push('name'); if(!f.phone?.trim())err.push('phone');
  if(!/^\S+@\S+\.\S+$/.test(f.email||''))err.push('a valid email'); if(post&&!f.address?.trim())err.push('postal address');
  if(!f.leadOk){ $('#ck-err').textContent='Please tick the box to confirm you understand the 1 week lead time.'; return; }
  if(err.length){ $('#ck-err').textContent='Please enter your '+err.join(', ')+'.'; return; }
  const c=Store.settings.costs, t=totals(ui.delivery);
  const btn=form.querySelector('button[type=submit]'); if(btn){ btn.disabled=true; btn.textContent='Sending order…'; }
  const cloudCust=CLOUD&&!Cloud.isAdmin;
  Store.addOrder({ id:uid(), number:orderNumber(), createdAt:Date.now(),
    customer:{name:f.name.trim(),email:f.email.trim(),phone:f.phone.trim(),address:post?f.address.trim():''}, delivery:ui.delivery,
    items:cartLines().map(l=>makeLine(l.product,l,Store.products,c)),
    subtotal:t.subtotal, shipping:t.shipping, total:t.total, status:'new', paid:false, notes:(f.notes||'').trim(), adminNotes:'',
    costPackaging:cloudCust?null:num(c.packagingPerOrder), costPostage:cloudCust?null:(post?num(c.postageActual):0), costFees:cloudCust?null:+(t.total*num(c.paymentFeePct)/100).toFixed(2) })
  .then(order=>{ ui.seenOrders=Store.orders.length; cart=[]; saveCart(); ui.lastOrder=order; if(CLOUD) sendOrderEmails(order); go('thanks'); })
  .catch(e=>{ console.error(e); if(btn){ btn.disabled=false; btn.textContent='Submit order'; } $('#ck-err').textContent='Sorry, your order didn\'t go through ('+(e.code||'connection problem')+'). Please try again.'; });
}

function printListData(o){
  const prints={}, packs={};
  const add=(name,colour,q)=>{const k=name+'|'+colour; prints[k]=(prints[k]||0)+q;};
  o.items.forEach(i=>{
    if(i.type==='kit'&&i.pieceColours){ i.pieceColours.forEach(x=>add(x.name,x.colour,i.qty)); if(i.marbles) packs[i.marbles]=(packs[i.marbles]||0)+i.qty; }
    else if(i.type==='kit'){ (i.picks||[]).forEach(x=>add(x.name,i.colour,x.qty*i.qty)); (i.fixed||[]).forEach(x=>add(x.name,i.colour,x.qty*i.qty)); if(i.marbles) packs[i.marbles]=(packs[i.marbles]||0)+i.qty; }
    else if(i.tier==='marbles') packs[i.name]=(packs[i.name]||0)+i.qty; else add(i.name,i.colour,i.qty);
  });
  const rows=Object.entries(prints).sort((a,b)=>a[0].split('|')[1].localeCompare(b[0].split('|')[1])||a[0].localeCompare(b[0])).map(([k,q])=>{const [n,c]=k.split('|');return [n,c,q];});
  return {rows,packs:Object.entries(packs)};
}
function printList(o){ // everything to print and pack, totalled by piece and colour
  const {rows,packs}=printListData(o);
  return `<div class="includes" style="margin-bottom:12px"><b>🖨️ Print & pack list</b><ul>
    ${rows.map(([n,c,q])=>`<li>${q} × ${esc(n)} ${c?`— ${swatch(c)}${esc(c)}`:''}</li>`).join('')}
    ${packs.map(([n,q])=>`<li>${q} × ${esc(n)}</li>`).join('')}</ul></div>`;
}

function syncEditor(){
  const f=document.querySelector('form[data-form=product]'); if(!f||!ui.editing) return;
  const d=new FormData(f), e=ui.editing;
  e.name=d.get('name')||''; e.price=num(d.get('price')); e.description=d.get('description')||''; e.active=!!d.get('active');
  if(e.type==='kit'){ e.randomBasic=num(d.get('randomBasic')); e.chooseBasic=num(d.get('chooseBasic')); e.choosePremium=num(d.get('choosePremium')); e.marbleChoice=!!d.get('marbleChoice'); e.colourChoice=!!d.get('colourChoice'); }
  else { e.tier=d.get('tier')||e.tier; ['grams','printHours','boughtIn'].forEach(k=>{ if(d.has(k)){ const v=num(d.get(k)); if(Math.abs(v-num(e[k]))>0.006) e[k]=v; } }); e.colourChoice=e.tier!=='marbles'&&!!d.get('colourChoice'); if(e.tier!=='marbles') e.recolour=!!d.get('recolour'); }
}
function resizeImage(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,700/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.82));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});
}

/* ---------- STATS ---------- */
function adminStats(){
  const live=Store.orders.filter(o=>o.status!=='cancelled'), paid=live.filter(o=>o.paid), unpaid=live.filter(o=>!o.paid);
  const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  const revenue=sum(paid,o=>o.total), outstanding=sum(unpaid,o=>o.total), costs=sum(paid,o=>orderCosts(o).total), oh=overheadsPerMonth();
  const now=new Date(), monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime(), thisMonth=sum(paid.filter(o=>o.createdAt>=monthStart),o=>o.total);
  const months=[...Array(6)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1),e=new Date(d.getFullYear(),d.getMonth()+1,1);
    const os=live.filter(o=>o.createdAt>=d&&o.createdAt<e), sales=sum(os,o=>o.total), cost=sum(os,o=>orderCosts(o).total)+oh;
    return {lbl:d.toLocaleDateString('en-AU',{month:'short'}),sales,cost,profit:sales-cost};});
  const mx=Math.max(1,...months.map(m=>Math.max(m.sales,m.cost)));
  const top={}; live.forEach(o=>o.items.forEach(i=>{const t=top[i.name]=top[i.name]||{qty:0,rev:0,cost:0};t.qty+=i.qty;t.rev+=i.price*i.qty;t.cost+=num(i.cost)*i.qty;}));
  const topList=Object.entries(top).sort((a,b)=>b[1].rev-a[1].rev).slice(0,8);
  const kpi=(k,v,sub='',col='')=>`<div class="kpi"><div class="k">${k}</div><div class="v" ${col?`style="color:${col}"`:''}>${v}</div>${sub?`<div class="muted small">${sub}</div>`:''}</div>`;
  const short=v=>(v<0?'−':'')+money(Math.abs(v)).replace(/\.\d\d$/,'');
  return `<div class="kpis">
    ${kpi('Paid revenue',money(revenue),`${paid.length} paid order${paid.length===1?'':'s'}`)}
    ${kpi('Awaiting payment',money(outstanding),`${unpaid.length} order${unpaid.length===1?'':'s'}`)}
    ${kpi('This month',money(thisMonth))}
    ${kpi('Avg order',money(live.length?sum(live,o=>o.total)/live.length:0))}
    ${kpi('Cost of paid orders',money(costs),'printing & marbles')}
    ${kpi('Profit on paid orders',money(revenue-costs),`before ${money(oh)}/mth overheads`,revenue-costs>=0?'var(--green)':'var(--red)')}
  </div>
  <div class="panel" style="margin-bottom:18px"><div class="row" style="flex-wrap:wrap"><b>Sales vs costs by month</b><div class="spacer"></div>
      <span class="small"><span class="swatch" style="background:var(--accent)"></span>Sales &nbsp;<span class="swatch" style="background:#E4572E"></span>Costs (incl. overheads)</span></div>
    <div class="bars" style="height:220px">${months.map(m=>`<div class="bar"><div style="display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center;height:160px">
        <div class="b" title="Sales ${money(m.sales)}" style="height:${m.sales/mx*150}px;max-width:26px;${m.sales?'':'min-height:0'}"></div>
        <div class="b" title="Costs ${money(m.cost)}" style="height:${m.cost/mx*150}px;max-width:26px;background:#E4572E;${m.cost?'':'min-height:0'}"></div></div>
        <div class="val" style="color:${m.profit>=0?'var(--green)':'var(--red)'}">${m.sales||m.cost?short(m.profit):''}</div><div class="lbl">${m.lbl}</div></div>`).join('')}</div>
    <div class="muted small" style="margin-top:6px">Green/red figure = profit for the month after costs and overheads.</div></div>
  <div class="panel"><b>Top sellers</b>${topList.length?`<table class="t"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Sales</th><th class="num hide-m">Cost</th><th class="num">Profit</th></tr></thead><tbody>
      ${topList.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num">${v.qty}</td><td class="num">${money(v.rev)}</td><td class="num hide-m muted">${money(v.cost)}</td><td class="num"><b>${money(v.rev-v.cost)}</b></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No sales yet.</div>`}</div>`;
}

/* colour maths */
function hexToHsv(hex){ const n=parseInt((hex||'#888888').slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
  if(d){ h= mx===r?((g-b)/d)%6 : mx===g?(b-r)/d+2 : (r-g)/d+4; h*=60; if(h<0) h+=360; }
  return {h, s:mx?d/mx:0, v:mx}; }
function hsvToHex({h,s,v}){ const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  const [r,g,b]= h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+[r,g,b].map(t=>Math.round((t+m)*255).toString(16).padStart(2,'0')).join('').toUpperCase(); }
const FILAMENT_PRESETS=['#E4572E','#F08A24','#F3B61F','#2E9E6A','#1ABC9C','#4A9BEA','#2F5FD0','#1F3A93','#7B5CD6','#EC6FA6','#8B5A2B','#B8BCC6','#F2F2F2','#2A2A2A'];

function ceRefresh(){ const e=ui.colEdit; if(!e) return; const hex=hsvToHex(e), q=id=>document.getElementById(id); if(!q('ce-sv')) return;
  q('ce-sv').style.background=`hsl(${e.h},100%,50%)`; Object.assign(q('ce-knob').style,{left:e.s*100+'%',top:(1-e.v)*100+'%',background:hex});
  Object.assign(q('ce-hknob').style,{left:e.h/360*100+'%',background:`hsl(${e.h},100%,50%)`}); q('ce-prev').style.background=hex;
  if(document.activeElement!==q('ce-hex')) q('ce-hex').value=hex; }
let ceDrag=null;
document.addEventListener('pointerdown',ev=>{ const t=ev.target.closest('[data-sv],[data-hue]'); if(!t||!ui.colEdit) return; ceDrag=t; try{t.setPointerCapture(ev.pointerId);}catch(_){} ceMove(ev); });
document.addEventListener('pointermove',ev=>{ if(ceDrag) ceMove(ev); });
let ceLast=0;
document.addEventListener('pointerup',()=>{ if(ceDrag) ceLast=Date.now(); ceDrag=null; });
function ceMove(ev){ const r=ceDrag.getBoundingClientRect(), x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)), y=Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height));
  if(ceDrag.hasAttribute('data-sv')){ ui.colEdit.s=x; ui.colEdit.v=1-y; } else ui.colEdit.h=Math.min(359.9,x*360); ceRefresh(); }

/* ---------- confirm dialog (browser confirm() is blocked in previews) ---------- */
function confirmBox(msg, onYes){
  $('#modal-root').insertAdjacentHTML('beforeend',`<div class="modal-bg" id="cfm"><div class="modal" style="max-width:380px"><p style="margin-top:0;font-weight:700">${esc(msg)}</p>
    <div class="row"><div class="spacer"></div><button class="btn" id="cfm-n">Cancel</button><button class="btn primary" id="cfm-y">Yes</button></div></div></div>`);
  $('#cfm-n').onclick=()=>$('#cfm').remove(); $('#cfm-y').onclick=()=>{$('#cfm').remove();onYes();};
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.classList.contains('modal-bg')&&e.target!==el) return; // clicks inside a modal don't close it
  const fn=actions[el.dataset.act]; if(fn){ if(el.tagName==='BUTTON'&&el.type!=='submit') e.preventDefault(); fn(el,e); }
});
document.addEventListener('change',async e=>{
  const el=e.target, k=el.dataset.chg; if(!k) return;
  if(k==='cardColour'||k==='exColour'){ const box=el.closest(k==='cardColour'?'.card':'.ex-row'), im=box?.querySelector('img[data-rcpid]'); if(im){ im.dataset.rc=colourHex(el.value); applyRecolour(box); } return; }
  if(k==='delivery'){ const keep=document.querySelector('form[data-form=checkout]'), vals=keep?Object.fromEntries(new FormData(keep)):null;
    ui.delivery=el.value; render(); if(vals){const f=document.querySelector('form[data-form=checkout]'); for(const [n,v] of Object.entries(vals)) if(f.elements[n]&&f.elements[n].type!=='radio') f.elements[n].value=v;} }
  if(k==='bMarble'){ ui.builder.marbles=el.value; render(); }
  if(k==='bPalette'){ ui.builder.palette=el.value; ui.builder.colourMap=assignColours(packagePieces(Store.product(ui.builder.kitId),ui.builder.picks,Store.products,ui.builder.swaps,ui.builder.rbasic).all,paletteByName(el.value),{},true); render(); }
  if(k==='orderStatus'){ Store.updateOrder(el.dataset.id,{status:el.value}); render(); toast('Status updated'); }
  if(k==='orderPaid'){ Store.updateOrder(el.dataset.id,{paid:el.value==='1'}); render(); toast(el.value==='1'?'Marked as paid':'Marked as unpaid'); }
  if(k==='orderNotes'){ Store.updateOrder(el.dataset.id,{adminNotes:el.value}); toast('Note saved'); }
  if(k==='productImage'){ const file=el.files[0]; if(!file) return; syncEditor(); try{ ui.editing.image=await resizeImage(file); }catch(err){ toast('Could not read that image'); } renderModal(); }
  if(k==='preBasicPart'){ syncEditor(); ui.editing.presetBasic[el.dataset.i].partId=el.value; renderModal(); }
  if(k==='preBasicQty'){ syncEditor(); ui.editing.presetBasic[el.dataset.i].qty=Math.max(1,parseInt(el.value)||1); renderModal(); }
  if(k==='incPart'){ syncEditor(); ui.editing.includes[el.dataset.i].partId=el.value; renderModal(); }
  if(k==='incAlt'){ syncEditor(); ui.editing.includes[el.dataset.i].alts[el.dataset.j]=el.value; renderModal(); }
  if(k==='incLabel'){ ui.editing.includes[el.dataset.i].label=el.value; }
  if(k==='incQty'){ syncEditor(); ui.editing.includes[el.dataset.i].qty=Math.max(1,parseInt(el.value)||1); renderModal(); }
  if(k==='cost'){ Store.settings.costs[el.dataset.k]=num(el.value); Store.save(); render(); }
  if(k==='costBool'){ Store.settings.costs[el.dataset.k]=el.checked; Store.save(); render(); }
  if(k==='setProfit'||k==='setMargin'){ const p=Store.product(el.dataset.id), cost=Math.round(costOf(p)*100)/100, v=el.value.trim(); // use the cost as shown (to the cent)
    if(v===''){ p.price=0; }
    else if(k==='setProfit') p.price=Math.max(0,+(cost+num(v)).toFixed(2));
    else { const m=Math.max(0,num(v)); p.price=+(cost*(1+m/100)).toFixed(2); }
    Store.save(); render(); }
  if(k==='partField'){ const p=Store.product(el.dataset.id); p[el.dataset.k]=num(el.value); Store.save(); render(); }
  if(k==='partTier'){ const p=Store.product(el.dataset.id); p.tier=el.value; if(p.tier==='marbles') p.colourChoice=false; Store.save(); render(); }
  if(k==='palName'){ Store.settings.palettes[el.dataset.i].name=el.value.trim()||'Palette'; Store.save(); }
  if(k==='palActive'){ Store.settings.palettes[el.dataset.i].active=el.checked; Store.save(); render(); }
  if(k==='colName'){ Store.settings.palettes[el.dataset.i].colours[el.dataset.j].name=el.value.trim()||'Colour'; Store.save(); }
  if(k==='colHex'){ Store.settings.palettes[el.dataset.i].colours[el.dataset.j].hex=el.value; Store.save(); }
  if(k==='ohName'){ Store.settings.costs.overheads[el.dataset.i].name=el.value; Store.save(); }
  if(k==='ohAmt'){ Store.settings.costs.overheads[el.dataset.i].amount=num(el.value); Store.save(); render(); }
});

if(CLOUD) Cloud.start();
</script>
